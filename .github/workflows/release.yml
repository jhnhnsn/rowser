name: Release

# A `v*` tag builds the four targets and publishes a GitHub Release.
# A manual run (workflow_dispatch) is the dry run: it builds and uploads the
# same assets as workflow artifacts, and publishes nothing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target "$TARGET"
      - name: Check the Linux binary is static
        if: contains(matrix.target, 'musl')
        run: |
          file "target/$TARGET/release/rowser"
          # A dynamic binary has an INTERP program header; static and
          # static-pie binaries do not. (ldd exits 0 on static-pie.)
          if readelf -lW "target/$TARGET/release/rowser" | grep -q INTERP; then
            echo "rowser for $TARGET is dynamically linked" >&2
            exit 1
          fi
      - name: Package
        run: |
          mkdir -p dist
          tar -czf "dist/rowser-$TARGET.tar.gz" -C "target/$TARGET/release" rowser
      - uses: actions/upload-artifact@v4
        with:
          name: rowser-${{ matrix.target }}
          path: dist/rowser-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches the Cargo.toml version
        if: github.event_name == 'push'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rowser") | .version')"
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match Cargo.toml version v$version" >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: rowser-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum rowser-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 4
      - uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
      - name: Installer
        # install.sh with the Cargo.toml version written in, so each Release's
        # rowser-installer.sh installs that Release.
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "rowser") | .version')"
          sed "s/__ROWSER_VERSION__/$version/" install.sh > dist/rowser-installer.sh
          grep -q "^ROWSER_VERSION=\"$version\"\$" dist/rowser-installer.sh
          sh -n dist/rowser-installer.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rowser-installer.sh
          path: dist/rowser-installer.sh
          if-no-files-found: error
      - name: Publish the GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # A tag with a pre-release part (v1.0.0-rc.1) publishes a pre-release.
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/rowser-*.tar.gz dist/SHA256SUMS dist/rowser-installer.sh \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag $prerelease
