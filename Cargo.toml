[package]
name = "rowser"
version = "1.0.0-rc.2"
edition = "2021"
description = "Open URLs from SSH sessions in the local browser, and forward OAuth callbacks back"
license-file = "LICENSE"
repository = "https://github.com/jhnhnsn/rowser"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
toml_edit = "0.22"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "std"] }
url = "2"

# macOS posts notices with osascript (#57); notify-rust is for the other platforms only.
[target.'cfg(not(target_os = "macos"))'.dependencies]
notify-rust = "4"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
