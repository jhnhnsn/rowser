[package]
name = "rowser"
version = "0.1.0"
edition = "2021"
description = "Open URLs from SSH sessions in the local browser, and forward OAuth callbacks back"
license-file = "LICENSE"
repository = "https://github.com/jhnhnsn/rowser"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
notify-rust = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "ansi", "std"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
